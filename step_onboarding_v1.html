<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #F9FAFB;
    color: #0A0A0F;

    font-weight: 700;
    letter-spacing: -0.022em;
    color: #0A0A0F;
    margin-bottom: 8px;
