<style>
  body {
    font-family: 'Pretendard', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #FFFFFF;
    letter-spacing: -0.011em;
    color: #0A0A0F;
  }
  .num { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }
  .en { font-family: 'Inter', system-ui, sans-serif; }

  /* Step navigator */
  .step-nav {
    transition: all 0.2s ease;
  }
  .step-nav:hover { opacity: 0.7; }

  /* Progress bar */
  .progress-track {
    background: #E5E5EA;
    height: 2px;
  }
  .progress-fill {
    background: #2563EB;
    height: 100%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Animated entry */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up 0.4s ease-out; }

  /* Loading dots */
  @keyframes pulse-dot {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  .pulse-dot:nth-child(1) { animation: pulse-dot 1.4s infinite ease-in-out; animation-delay: -0.32s; }
  .pulse-dot:nth-child(2) { animation: pulse-dot 1.4s infinite ease-in-out; animation-delay: -0.16s; }
  .pulse-dot:nth-child(3) { animation: pulse-dot 1.4s infinite ease-in-out; }

  /* Spinner ring */
  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }
  .spin-ring { animation: spin-ring 1.4s linear infinite; }

  /* Check fill animation */
  @keyframes check-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .check-pop { animation: check-pop 0.4s ease-out forwards; }

  /* Soft float for hero icon */
  @keyframes float-soft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .float-soft { animation: float-soft 3s ease-in-out infinite; }

  /* Input focus state matching screenshot tone */
  input:focus, textarea:focus {
    outline: none;
    border-color: #2563EB;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  /* Section divider — used between steps in this single-page demo */
  .step-section {
    border-bottom: 1px dashed #E5E5EA;
  }

  /* Stripe card-element placeholder style */
  .card-input-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  /* Timeline */
  .timeline-dot {
    width: 14px; height: 14px;
    border-radius: 9999px;
    border: 2px solid #2563EB;
    background: white;
    z-index: 2;
  }
  .timeline-dot.active {
    background: #2563EB;
  }
  .timeline-line {
    position: absolute;
    top: 6px; left: 7px; right: 7px;
    height: 2px; background: #DBEAFE;
    z-index: 1;
  }

  /* Pulse for the live "analyzing" line */
  @keyframes hint-shimmer {
    0%, 100% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .hint-bar {
    background: linear-gradient(90deg, #DBEAFE 0%, #2563EB 50%, #DBEAFE 100%);
    background-size: 200% 100%;
    animation: hint-shimmer 1.8s linear infinite;
  }

  /* Score bar */
  .score-bar { height: 4px; background: #F1F1F4; border-radius: 9999px; overflow: hidden; }
  .score-bar-fill { height: 100%; background: #10B981; border-radius: 9999px; }
  .score-bar-fill.warn { background: #F59E0B; }

  /* Step header demo banner */
  .demo-banner {
    background: linear-gradient(180deg, #0A0A0F 0%, #1A1A22 100%);
  }
</style>
</head>

</nav>

          </div>

        <p class="text-[12px] text-ink-400 mt-2 flex items-center gap-1.5">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          입력하신 정보는 분석 용도로만 사용됩니다.
        </p>
      </div>

      <a href="step_onboarding_step2.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-[15px] font-medium py-4 rounded-xl transition flex items-center justify-center gap-2">
        다음으로
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

      <button class="w-full bg-ink-50 hover:bg-ink-100 text-ink-700 text-[14px] font-medium py-3.5 rounded-xl transition">

      </button>
    </div>

  </div>
</section>
