<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설정 완료! · 검은띠 달성 | STEP Manager</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: linear-gradient(180deg, rgba(239, 246, 255, 0.4) 0%, white 100%); color: #0A0A0F; letter-spacing: -0.011em; font-size: 15px; min-height: 100vh; }
  .num { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; border: 0; }

  .top-progress { height: 3px; background: linear-gradient(90deg, #10B981 0%, #2563EB 100%); }

  .top-bar { background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-bottom: 1px solid #F1F1F4; padding: 14px 32px; display: flex; align-items: center; justify-content: center; }
  .top-bar-logo { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
  .logo-mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #2563EB 0%, #3B82F6 100%); display: flex; align-items: center; justify-content: center; }

  .container { max-width: 680px; margin: 0 auto; padding: 80px 24px 64px; text-align: center; }

  .celebration-icon-wrap { position: relative; display: inline-block; margin-bottom: 32px; }
  .celebration-icon { width: 96px; height: 96px; border-radius: 9999px; background: #2563EB; display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 48px -8px rgba(37, 99, 235, 0.4); animation: celebrate 0.6s ease-out; }
  @keyframes celebrate { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

  .confetti { position: absolute; width: 8px; height: 8px; animation: confetti-fall 1.6s ease-out forwards; }
  @keyframes confetti-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(60px) rotate(360deg); opacity: 0; } }

  h1.title { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 16px; }
  h1.title .accent { color: #2563EB; }
  .subtitle { font-size: 16px; color: #6B6B78; line-height: 1.65; margin-bottom: 40px; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
  .stat-card { background: white; border: 1px solid #F1F1F4; border-radius: 16px; padding: 24px; text-align: center; }
  .stat-icon-wrap { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .stat-icon-wrap.blue { background: #EFF6FF; color: #2563EB; }
  .stat-icon-wrap.green { background: rgba(16,185,129,0.1); color: #10B981; }
  .stat-icon-wrap.warn { background: rgba(245,158,11,0.1); color: #F59E0B; }
  .stat-label { font-size: 12px; color: #6B6B78; margin-bottom: 4px; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; color: #0A0A0F; }
  .stat-meta { font-size: 11px; color: #9B9BA8; margin-top: 4px; }

  .xiro-card { background: white; border: 1px solid #F1F1F4; border-radius: 18px; padding: 24px; display: flex; align-items: flex-start; gap: 16px; text-align: left; margin-bottom: 40px; box-shadow: 0 4px 16px -4px rgba(37, 99, 235, 0.08); }
  .xiro-mark { width: 56px; height: 56px; border-radius: 9999px; background: linear-gradient(135deg, #2563EB 0%, #60A5FA 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.3); animation: float-soft 3s ease-in-out infinite; }
  @keyframes float-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .xiro-label { font-size: 12px; color: #2563EB; font-weight: 600; margin-bottom: 4px; }
  .xiro-message { font-size: 15px; color: #0A0A0F; line-height: 1.7; }
  .xiro-message .strong { font-weight: 700; }

  .ready-text { font-size: 14px; color: #6B6B78; margin-bottom: 20px; }

  .btn-primary { background: #2563EB; color: white; padding: 18px 32px; font-size: 17px; font-weight: 600; border-radius: 14px; width: 100%; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.3); }
  .btn-primary:hover { background: #1D4ED8; transform: translateY(-1px); box-shadow: 0 12px 32px -4px rgba(37, 99, 235, 0.4); }

  .back-link { margin-top: 24px; font-size: 13px; color: #9B9BA8; }
  .back-link a { color: #6B6B78; text-decoration: underline; }
  .back-link a:hover { color: #2563EB; }
</style>
</head>
<body>

<div class="top-progress"></div>

<div class="top-bar">
  <a class="top-bar-logo">
    <div class="logo-mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    STEP Manager · 도장 초기 설정 완료
  </a>
</div>

<div class="container">

  <div class="celebration-icon-wrap">
    <div class="celebration-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c1.66 0 3.22.45 4.56 1.24"/></svg>
    </div>
    <span class="confetti" style="background: #2563EB; left: -20px; top: 10px; animation-delay: 0.1s;"></span>
    <span class="confetti" style="background: #FCD34D; left: calc(100% + 10px); top: 0; animation-delay: 0.3s; border-radius: 50%;"></span>
    <span class="confetti" style="background: #10B981; left: -10px; top: 60px; animation-delay: 0.2s;"></span>
    <span class="confetti" style="background: #DC2626; right: -10px; top: 50px; animation-delay: 0.4s; border-radius: 50%;"></span>
    <span class="confetti" style="background: #A855F7; left: 60%; top: -10px; animation-delay: 0.5s;"></span>
  </div>

  <h1 class="title">🎉 검은띠 달성!<br><span class="accent">기본 설정 완료입니다.</span></h1>
  <p class="subtitle">Steve 관장님의 도장이 완벽하게 준비되었어요.<br>이제 STEP과 함께 도장을 운영하실 수 있어요.</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon-wrap blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      </div>
      <div class="stat-label">학생</div>
      <div class="stat-num">24</div>
      <div class="stat-meta">명 등록 완료</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon-wrap green">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="stat-label">수업</div>
      <div class="stat-num">6</div>
      <div class="stat-meta">개 시간표 등록</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon-wrap warn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div class="stat-label">띠 단계</div>
      <div class="stat-num">9</div>
      <div class="stat-meta">단계 설정 완료</div>
    </div>
  </div>

  <div class="xiro-card">
    <div class="xiro-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><circle cx="12" cy="12" r="3" fill="white"/><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3"/></svg>
    </div>
    <div>
      <div class="xiro-label">Xiro</div>
      <div class="xiro-message">
        안녕하세요, 저는 <span class="strong">Xiro</span>입니다.<br>
        이제부터 도장 관리, 수련생, 승급, 일상 운영을 함께 도와드릴게요.<br>
        궁금한 점은 언제든 채팅으로 물어보세요.
      </div>
    </div>
  </div>

  <p class="ready-text">도장 준비 완료. 이제 시작하시겠어요?</p>

  <a class="btn-primary" href="step_main_v4.html">
    STEP Manager 시작하기
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </a>

  <div class="back-link">
    <a href="step_index.html">← 인덱스로 돌아가기</a>
  </div>

</div>

</body>
</html>
